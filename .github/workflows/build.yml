name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -q timers-apk.zip

      - name: Install and sync Capacitor
        working-directory: timers-apk
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add native code
        working-directory: timers-apk
        run: |
          mkdir -p android/app/src/main/java
          cp -r native-android/java/com android/app/src/main/java/
          cp -r native-android/res/* android/app/src/main/res/
          python3 patch_manifest.py

      - name: Build APK
        working-directory: timers-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: timers-apk
          path: timers-apk/android/app/build/outputs/apk/debug/app-debug.apk
