name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -q timers-apk.zip

      - name: Install and sync Capacitor
        working-directory: timers-apk
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add native code
        working-directory: timers-apk
        run: |
          mkdir -p android/app/src/main/java
          cp -r native-android/java/com android/app/src/main/java/
          cp -r native-android/res/* android/app/src/main/res/
          sed -i 's/(long) call.getDouble("at", 0d)/call.getDouble("at", 0d).longValue()/' android/app/src/main/java/com/example/timers/TimerBridgePlugin.java
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "TimerAlarmReceiver" in s:
              raise SystemExit
          snip = open("native-android/AndroidManifest-snippet.xml", encoding="utf-8").read()
          snip = re.sub(r"<!--.*?-->", "", snip, flags=re.S)
          parts = snip.split("<receiver", 1)
          perms = parts[0].strip()
          app = "<receiver" + parts[1]
          s = s.replace("<application", perms + "\n    <application", 1)
          s = s.replace("</application>", app.strip() + "\n    </application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Build APK
        working-directory: timers-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: timers-apk
          path: timers-apk/android/app/build/outputs/apk/debug/app-debug.apk
